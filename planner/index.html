<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUENQUEN PLANNER</title><style>body{margin:0;background:#101014;color:white;font:16px system-ui;padding:24px}main{max-width:900px;margin:auto}h1{color:#ffdf37}textarea{width:100%;box-sizing:border-box;min-height:180px;background:#222;color:white;border:1px solid #666;border-radius:10px;padding:15px;font:16px system-ui}button{padding:13px 20px;border:0;border-radius:9px;background:#ffdf37;color:#111;font-weight:800;cursor:pointer;margin:12px 8px 12px 0}canvas{max-width:100%;border-radius:12px}small{color:#aaa}</style><main><h1>QUENQUEN PLANNER</h1><p>Une ligne par live : <b>Jour | Heure | Émission</b></p><textarea id="schedule">Mardi | 20h30 | Radio QuenQuen&#10;Jeudi | 21h00 | Gaming&#10;Samedi | 21h00 | Soirée communautaire</textarea><div><button id="generate">Générer le planning</button><button id="download">Télécharger le PNG</button><button id="login" type="button">Connexion Twitch</button><button id="publish" type="button" disabled>Publier sur Discord</button><button id="logout" type="button" hidden>Déconnexion</button></div><p id="authStatus" role="status">Connexion Twitch nécessaire pour publier.</p><canvas id="poster" width="1200" height="675"></canvas><p><small>Le planning est généré localement. La publication envoie le PNG et le récapitulatif sur Discord, uniquement depuis le compte administrateur.</small></p></main><script>const c=document.querySelector('#poster'),x=c.getContext('2d');function draw(){let lines=document.querySelector('#schedule').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8);x.fillStyle='#111116';x.fillRect(0,0,1200,675);x.fillStyle='#ffdf37';x.fillRect(0,0,22,675);x.font='bold 67px system-ui';x.fillText('QUENQUEN CORP',65,105);x.fillStyle='#fff';x.font='bold 35px system-ui';x.fillText('PLANNING DES LIVES',67,163);let step=Math.min(67,420/Math.max(1,lines.length));lines.forEach((s,i)=>{let parts=s.split('|').map(t=>t.trim());let y=225+i*step;x.fillStyle=i%2?'#24242a':'#303039';x.fillRect(65,y-36,1070,step-6);x.fillStyle='#ffdf37';x.font='bold 28px system-ui';x.fillText((parts[0]||'LIVE').slice(0,15),86,y);x.fillStyle='#fff';x.fillText((parts[1]||'').slice(0,12),330,y);x.font='26px system-ui';x.fillText((parts.slice(2).join(' | ')||'').slice(0,42),535,y)});x.fillStyle='#ffdf37';x.font='bold 25px system-ui';x.fillText('TWITCH.TV/FRENCHQUENQUEN_',65,641)}document.querySelector('#generate').onclick=draw;document.querySelector('#download').onclick=()=>{draw();let a=document.createElement('a');a.download='quenquen-planning.png';a.href=c.toDataURL('image/png');a.click()};draw();</script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://qfkjrlpkykkizrmzlixp.supabase.co','sb_publishable_tBGclmheOxP-q6MVKz1SJQ_Mc3PDRnG',{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const status=document.getElementById('authStatus'),login=document.getElementById('login'),logout=document.getElementById('logout'),publish=document.getElementById('publish');
const adminId='981b43b7-511b-4e1b-9517-442274c4371b';
async function refresh(){const {data:{user}}=await sb.auth.getUser();const admin=user?.id===adminId;login.hidden=!!user;logout.hidden=!user;publish.disabled=!admin;status.textContent=!user?'Connecte-toi avec Twitch pour publier.':admin?'Administrateur connecté : publication autorisée.':'Compte connecté : publication réservée à l’administrateur.';}
login.onclick=async()=>{login.disabled=true;const {error}=await sb.auth.signInWithOAuth({provider:'twitch',options:{redirectTo:location.origin+location.pathname}});if(error){status.textContent='Connexion impossible : '+error.message;login.disabled=false;}};
logout.onclick=async()=>{await sb.auth.signOut();await refresh()};
sb.auth.onAuthStateChange(()=>{refresh()});refresh();
publish.onclick=async()=>{
 publish.disabled=true;status.textContent='Publication en cours…';
 try{
 const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Reconnecte-toi avec Twitch.');
 const raw=document.getElementById('schedule').value.split('\n').map(s=>s.trim()).filter(Boolean);
 if(!raw.length||raw.length>8)throw Error('Indique entre 1 et 8 lives.');
 const entries=raw.map(s=>{const p=s.split('|').map(t=>t.trim());if(p.length<3||!p[0]||!p[1]||!p.slice(2).join('|').trim())throw Error('Format attendu : Jour | Heure | Émission');return {day:p[0],time:p[1],title:p.slice(2).join(' | ')}});
 draw();
 const image=document.getElementById('poster').toDataURL('image/png');
 const response=await fetch('https://qfkjrlpkykkizrmzlixp.supabase.co/functions/v1/quenquen-planner-publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_tBGclmheOxP-q6MVKz1SJQ_Mc3PDRnG'},body:JSON.stringify({entries,image})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'Erreur de publication ('+response.status+')');
 status.textContent='Planning et image PNG publiés sur Discord !';
 }catch(e){status.textContent='Échec : '+e.message}finally{const {data:{user}}=await sb.auth.getUser();publish.disabled=user?.id!==adminId;}
};
</script></html>
