<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUENQUEN PLANNER</title><style>body{margin:0;background:#101014;color:white;font:16px system-ui;padding:24px}main{max-width:900px;margin:auto}h1{color:#ffdf37}textarea{width:100%;box-sizing:border-box;min-height:180px;background:#222;color:white;border:1px solid #666;border-radius:10px;padding:15px;font:16px system-ui}button{padding:13px 20px;border:0;border-radius:9px;background:#ffdf37;color:#111;font-weight:800;cursor:pointer;margin:12px 8px 12px 0}canvas{max-width:100%;border-radius:12px}small{color:#aaa}</style><main><h1>QUENQUEN PLANNER</h1><p>Une ligne par live : <b>Jour | Heure | Émission</b></p><textarea id="schedule">Mardi | 20h30 | Radio QuenQuen&#10;Jeudi | 21h00 | Gaming&#10;Samedi | 21h00 | Soirée communautaire</textarea><div><button id="generate">Générer le planning</button><button id="download">Télécharger le PNG</button></div><canvas id="poster" width="1200" height="675"></canvas><p><small>Prototype local : aucune publication Discord ni stockage serveur pour le moment. La connexion Discord nécessitera un webhook protégé côté serveur.</small></p></main><script>const c=document.querySelector('#poster'),x=c.getContext('2d');function draw(){let lines=document.querySelector('#schedule').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8);x.fillStyle='#111116';x.fillRect(0,0,1200,675);x.fillStyle='#ffdf37';x.fillRect(0,0,22,675);x.font='bold 67px system-ui';x.fillText('QUENQUEN CORP',65,105);x.fillStyle='#fff';x.font='bold 35px system-ui';x.fillText('PLANNING DES LIVES',67,163);let step=Math.min(67,420/Math.max(1,lines.length));lines.forEach((s,i)=>{let parts=s.split('|').map(t=>t.trim());let y=225+i*step;x.fillStyle=i%2?'#24242a':'#303039';x.fillRect(65,y-36,1070,step-6);x.fillStyle='#ffdf37';x.font='bold 28px system-ui';x.fillText((parts[0]||'LIVE').slice(0,15),86,y);x.fillStyle='#fff';x.fillText((parts[1]||'').slice(0,12),330,y);x.font='26px system-ui';x.fillText((parts.slice(2).join(' | ')||'').slice(0,42),535,y)});x.fillStyle='#ffdf37';x.font='bold 25px system-ui';x.fillText('TWITCH.TV/FRENCHQUENQUEN_',65,641)}document.querySelector('#generate').onclick=draw;document.querySelector('#download').onclick=()=>{draw();let a=document.createElement('a');a.download='quenquen-planning.png';a.href=c.toDataURL('image/png');a.click()};draw();</script></html>
