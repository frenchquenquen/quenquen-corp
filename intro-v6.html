<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUENQUEN</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at center,#06121d 0%,#010408 55%,#000 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}#nebula{position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 50%,rgba(0,132,184,.19),transparent 38%),radial-gradient(ellipse at 60% 45%,rgba(15,36,98,.24),transparent 52%);opacity:0;transition:opacity 1.5s}#halo{position:absolute;left:50%;top:48%;width:min(65vw,70vh);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.15);background:radial-gradient(circle,rgba(0,185,245,.4),rgba(0,95,170,.09) 38%,transparent 70%);filter:blur(18px);opacity:0}#logo{position:absolute;left:50%;top:44%;width:min(58vw,62vh);max-height:68vh;object-fit:contain;transform:translate(-50%,-50%) scale(2.4);opacity:0;filter:brightness(1.9) drop-shadow(0 0 50px #00caff);clip-path:none}#brand{position:absolute;left:50%;top:76%;transform:translate(-50%,35px) scale(.94);width:95%;text-align:center;opacity:0;text-shadow:0 3px 0 #063a49,0 0 24px #00a7d7}#brand .wordmark{display:block;width:min(70vw,900px);max-width:100%;height:auto;margin:auto;filter:drop-shadow(0 0 13px rgba(0,190,235,.35))}#brand small{display:block;font-size:clamp(13px,2.4vw,28px);letter-spacing:.26em;font-weight:900;color:#f5fbff;margin-top:4px;text-shadow:0 0 16px #58dfff}#flash{position:absolute;inset:0;background:#d6f7ff;opacity:0;pointer-events:none}#ring{position:absolute;left:50%;top:44%;width:10vmin;height:10vmin;border:3px solid #83e9ff;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;box-shadow:0 0 25px #00caff}#vignette{position:absolute;inset:0;box-shadow:inset 0 0 22vw 4vw #000;pointer-events:none}#ui{position:absolute;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;width:95%}button{border:1px solid #3ccdea;background:#051923;color:white;padding:12px 19px;border-radius:8px;font-weight:bold;cursor:pointer}button:hover{background:#0b3647}body.playing #ui{opacity:0;pointer-events:none}body.autoplay #ui{display:none}body.playing #nebula{opacity:1}body.playing #halo{animation:haloIn 6.6s both}body.playing #ring{animation:ringOut 6.6s both}body.playing #flash{animation:flash 6.6s both}@keyframes logoReveal{0%,24%{opacity:0;transform:translate(-50%,-50%) scale(.25);filter:brightness(4) blur(20px) drop-shadow(0 0 45px #00d7ff)}36%{opacity:.6;transform:translate(-50%,-50%) scale(.76);filter:brightness(2) blur(6px) drop-shadow(0 0 40px #00d7ff)}54%{opacity:1;transform:translate(-50%,-50%) scale(1.15);filter:brightness(2) blur(0) drop-shadow(0 0 55px #00d7ff)}61%{transform:translate(-50%,-50%) scale(.96);filter:brightness(1.2) drop-shadow(0 0 22px #00b5e5)}70%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1) drop-shadow(0 0 12px #007fa3)}}@keyframes haloIn{0%,35%{opacity:0;transform:translate(-50%,-50%) scale(.2)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%,100%{opacity:.36;transform:translate(-50%,-50%) scale(1.2)}}@keyframes ringOut{0%,54%{opacity:0;transform:translate(-50%,-50%) scale(.2)}55%{opacity:1}72%,100%{opacity:0;transform:translate(-50%,-50%) scale(13)}}@keyframes flash{0%,54%{opacity:0}55%{opacity:.92}58%{opacity:0}100%{opacity:0}}@keyframes brandIn{0%,59%{opacity:0;transform:translate(-50%,35px) scale(.92)}68%{opacity:1;transform:translate(-50%,0) scale(1.035)}76%,100%{opacity:1;transform:translate(-50%,0) scale(1)}}@media(max-width:600px){#logo{width:75vw;top:43%}#brand{top:70%}#brand .wordmark{width:92vw}}

#artwork{position:absolute;left:50%;top:50%;width:min(90vw,1320px);height:auto;max-height:87vh;object-fit:contain;opacity:0;transform:translate(-50%,-50%) scale(.55);filter:blur(12px) brightness(1.7);pointer-events:none;z-index:5;}

@keyframes artworkIn{0%,30%{opacity:0;transform:translate(-50%,-50%) scale(.35);filter:blur(16px) brightness(2)}48%{opacity:.8;transform:translate(-50%,-50%) scale(.9);filter:blur(3px) brightness(1.5)}54%{opacity:1;transform:translate(-50%,-50%) scale(1.075);filter:blur(0) brightness(1.75) drop-shadow(0 0 36px #00bddd)}64%{opacity:1;transform:translate(-50%,-50%) scale(.985);filter:brightness(1.1) drop-shadow(0 0 17px #0097c5)}75%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1) drop-shadow(0 0 7px #007ea6)}}
@media(max-width:700px){#artwork{width:98vw;max-height:78vh}}

.piece{position:absolute;left:50%;top:50%;width:min(90vw,1320px);height:auto;max-height:87vh;object-fit:contain;opacity:0;transform:translate(-50%,-50%) scale(1);pointer-events:none;z-index:5;}
body.playing #piece0{animation:qFirst 6.6s both}
body.playing #piece1{animation:wordSecond 6.6s both}
body.playing #piece2{animation:subtitleThird 6.6s both}
@keyframes qFirst{0%,19%{opacity:0;transform:translate(-50%,-50%) scale(1.7);filter:blur(15px) brightness(2)}34%{opacity:1;transform:translate(-50%,-50%) scale(1.08);filter:blur(0) brightness(1.6) drop-shadow(0 0 22px #00bfff)}53%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1) drop-shadow(0 0 9px #008bab)}54%{filter:brightness(1.8) drop-shadow(0 0 36px #00dfff)}65%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1)}}
@keyframes wordSecond{0%,54%{opacity:0;transform:translate(-50%,-47%) scale(.88);filter:blur(10px) brightness(2)}63%{opacity:1;transform:translate(-50%,-50%) scale(1.035);filter:blur(0) brightness(1.3) drop-shadow(0 0 18px #00bfff)}72%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1)}}
@keyframes subtitleThird{0%,65%{opacity:0;transform:translate(-50%,-48%) scale(.96);filter:blur(6px)}76%,100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}
@media(max-width:700px){.piece{width:98vw;max-height:78vh}}

#skipIntro,#soundFallback{position:fixed;z-index:40;right:max(14px,env(safe-area-inset-right));border:1px solid rgba(115,220,242,.42);background:rgba(0,8,12,.62);color:#dffaff;padding:9px 13px;border-radius:7px;font-size:clamp(10px,1.7vw,13px);letter-spacing:.08em;backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(0,180,220,.1)}#skipIntro{top:max(14px,env(safe-area-inset-top));opacity:.76}#skipIntro:hover{opacity:1;background:rgba(4,35,45,.9)}#soundFallback{top:max(58px,calc(env(safe-area-inset-top) + 50px));border-color:rgba(255,207,87,.6);color:#fff0bb}#skipIntro[hidden],#soundFallback[hidden]{display:none}
